name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend-unit:
    name: Backend unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest tests --ignore=tests/integration -q

  extraction-harness:
    name: Extraction eval harness (no API key)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      # A perfect extractor must score exactly 100%. If it does not, the corpus
      # or the scoring is broken — which would silently corrupt any accuracy
      # figure measured later against a real provider. This checks the ruler,
      # not the model; the model's number needs a key and is run separately.
      - name: Harness self-check
        run: python -m app.eval_extraction --stub oracle --min-accuracy 1.0 --max-hallucination 0.0

  backend-integration:
    name: Backend integration tests (Postgres + Redis)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: freight
          POSTGRES_PASSWORD: freight
          POSTGRES_DB: freight_ai_ops
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U freight -d freight_ai_ops"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      RUN_INTEGRATION: "1"
      APP_ENV: ci
      SECRET_KEY: ci-only-secret-key-not-for-production
      ADMIN_EMAIL: ci@example.com
      ADMIN_PASSWORD: ci-password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_USER: freight
      POSTGRES_PASSWORD: freight
      POSTGRES_DB: freight_ai_ops
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_BROKER_URL: redis://127.0.0.1:6379/1
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/2
      LLM_PROVIDER: anthropic
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest tests/integration -q

  frontend-build:
    name: Frontend build (production)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
